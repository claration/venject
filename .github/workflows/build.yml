name: Build

on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Dependencies (apt-get)
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf rpm

          curl -L -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      # actions cmake doesn't come with appimage cpack
      - name: Install CMake
        uses: ssrobins/install-cmake@da13ba26f50a41d3b03cfe8ca7265903f04a8932 # v1
        with:
          version: 4.4.2

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        name: Install Qt
        with:
          host: linux
          modules: qtmultimedia
          version: '6.10.1'
          dir: ${{ github.workspace }}

      - name: Build
        run: |
          make package JOBS=$(nproc) BUILD_TYPE=Release PACKAGE_GENERATOR=AppImage ENABLE_QT_DEPLOY=ON
          make package JOBS=$(nproc) BUILD_TYPE=Release PACKAGE_GENERATOR=RPM ENABLE_QT_DEPLOY=OFF
          make package JOBS=$(nproc) BUILD_TYPE=Release PACKAGE_GENERATOR=DEB ENABLE_QT_DEPLOY=OFF

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: launcher-linux-x86_64
          path: |
            build/*.AppImage
            build/*.rpm
            build/*.deb

  build-windows:
      strategy:
        fail-fast: false
        matrix:
          include:
            - os: windows-latest
              arch: x86_64
              msystem: MINGW64
              toolchain: mingw-w64-x86_64-toolchain
              cmake: mingw-w64-x86_64-cmake
              qt_base: mingw-w64-x86_64-qt6-base
              qt_declarative: mingw-w64-x86_64-qt6-declarative
              qt_tools: mingw-w64-x86_64-qt6-tools
              qt_svg: mingw-w64-x86_64-qt6-svg

            - os: windows-11-arm
              arch: arm64
              msystem: CLANGARM64
              toolchain: mingw-w64-clang-aarch64-toolchain
              cmake: mingw-w64-clang-aarch64-cmake
              qt_base: mingw-w64-clang-aarch64-qt6-base
              qt_declarative: mingw-w64-clang-aarch64-qt6-declarative
              qt_tools: mingw-w64-clang-aarch64-qt6-tools
              qt_svg: mingw-w64-clang-aarch64-qt6-svg

      runs-on: ${{ matrix.os }}

      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - name: Install dependencies (msys2)
          uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
          with:
            msystem: ${{ matrix.msystem }}
            install: >
              git
              ${{ matrix.toolchain }}
              ${{ matrix.cmake }}
              mingw-w64-x86_64-nsis
              ${{ matrix.qt_base }}
              ${{ matrix.qt_declarative }}
              ${{ matrix.qt_tools }}
              ${{ matrix.qt_svg }}
              make
              patch
            update: true

        - name: Build
          if: matrix.os == 'windows-latest'
          shell: msys2 {0}
          run: |
            make package BUILD_TYPE=Release JOBS=$(nproc)

        - name: Build
          if: matrix.os == 'windows-11-arm'
          shell: msys2 {0}
          run: |
            export PATH="/mingw64/bin:$PATH"
            make package BUILD_TYPE=Release JOBS=$(nproc) CPACK_PACKAGE_FILE_NAME=VencordLauncher-windows-arm64-setup|| exit_code=$?

            if [ -f "build/_CPack_Packages/win64/NSIS/PreinstallOutput.log" ]; then
              cat build/_CPack_Packages/win64/NSIS/PreinstallOutput.log
            fi

            exit ${exit_code:-0}

        - name: Upload
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          with:
            name: launcher-windows-${{ matrix.arch }}
            path: |
              build/*-setup.exe

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]

    steps:
    - name: Download Linux x86_64 Artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: launcher-linux-x86_64
        path: dist/

    - name: Download Windows x86_64 Artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: launcher-windows-x86_64
        path: dist/

    - name: Download Windows ARM64 Artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: launcher-windows-arm64
        path: dist/

    - name: Create Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: ${{ env.VERSION }}
        tag_name: ${{ env.VERSION }}
        files: |
          dist/*
        generate_release_notes: true
        fail_on_unmatched_files: true
        draft: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
